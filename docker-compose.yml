services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: salalibre
      POSTGRES_PASSWORD: salalibre
      POSTGRES_DB: salalibre
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - salalibre-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salalibre -d salalibre"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  salalibre-db: